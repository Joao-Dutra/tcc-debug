services:
  web:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Código montado do host para recarga automática.
      - .:/app
      # Volume anônimo protege o node_modules do container de ser
      # sobrescrito pelo node_modules do host (que pode ser de outro SO).
      - /app/node_modules
    environment:
      # Necessário para o hot reload funcionar através do volume no Docker.
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
